<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Synartesis</title>
    <!--
      Nothing loads from anywhere. The fonts, the script and the styles are all
      in the bundle, so this page cannot be talked into fetching something by
      anything a model writes into it -- and a window that renders text written
      elsewhere is exactly where that matters.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
