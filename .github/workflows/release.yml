# Build the desktop application for every platform, and attach it to the
# release for the tag.
#
# It has to be built on the machine it is built for: the mac bundle wants a
# mac to sign and staple it, and the Windows installer wants a Windows box
# rather than wine pretending to be one. So three runners, one release.
#
# Nothing here publishes to npm. That is `npm publish`, run by a person with
# the credentials, which is where it belongs.
name: release

on:
  push:
    tags: ["v*"]
  # Two uses. With a tag, it builds that tag and attaches the installers to
  # its release -- for a tag pushed before this workflow existed, or a run that
  # failed halfway. With the box left empty it builds this branch and publishes
  # nothing, which is the only honest way to find out whether a build works on
  # three platforms without spending a version number to ask.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish. Empty builds this branch and publishes nothing.
        required: false
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Signing and notarisation happen only where the secrets exist. Without
      # them the build still succeeds and produces an unsigned application,
      # which is what a fork gets: see app/README.md.
      - name: Build the application
        run: pnpm app:dist
        env:
          # Either route notarize.cjs accepts: an App Store Connect key, or an
          # Apple ID with an app-specific password. Whichever is set wins; with
          # neither, the build says so and carries on unsigned.
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      # The installers only. The unpacked directories are build intermediates
      # and are several hundred megabytes of nothing anybody downloads.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          if-no-files-found: error
          path: |
            app/release/*.dmg
            app/release/*.zip
            app/release/*.exe
            app/release/*.AppImage
            app/release/*.deb
            app/release/latest*.yml

  attach:
    needs: build
    # A rehearsal has no tag and therefore nothing to attach to. Everything
    # above still ran, which is the whole point of it.
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ls -la installers
          # A release for this tag may already exist; make one only if it does
          # not, and never overwrite notes somebody has written by hand.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" installers/* --clobber
