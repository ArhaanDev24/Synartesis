name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Both, because better-sqlite3 compiles native bindings and the demo drives
    # real subprocesses; a suite that only ever runs on one machine's quirks is
    # not evidence of much.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build first and prove the built proxy actually starts. When a spawned
      # child dies its stderr is easy to lose inside a test runner, and the
      # failure then looks like an unhelpful "connection closed".
      - run: pnpm build
      - name: Smoke test the built proxy
        run: |
          set -x
          ls -la dist
          node -e "require('better-sqlite3'); console.log('better-sqlite3 loads')"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | node dist/proxy.js --manifest manifests/toy-crm.yaml --journal "$RUNNER_TEMP/smoke.db"

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # The demo is the thing a stranger runs first, so it has to keep working.
      - run: ./demo/filesystem-demo.sh
        env:
          DEMO_PAUSE: 0
          GATE_TIMEOUT: 2

      # And the installer, which is the line the front page tells them to run.
      - run: ./install.sh --no-link
