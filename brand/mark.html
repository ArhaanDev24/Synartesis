<!doctype html>

  The mark as a square image, for the cards beside it and for anywhere that
  wants one file.

  logo ends up being three slightly different logos, which is what happened.

  Render:
    node brand/shoot.mjs brand/mark.html brand/synartesis-mark-1080.png 1080 1080 1
    node brand/shoot.mjs brand/mark.html brand/synartesis-mark-300.png 300 300 1
-->
<style>
  html, body { margin: 0; background: #5e1420; }
  img { display: block; width: 100vw; height: 100vh; }
</style>
