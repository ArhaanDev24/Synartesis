# Policy for @modelcontextprotocol/server-filesystem.
#
# Verified against version 2026.7.10 with real files. Point the args at the
# directory you want the agent confined to; the server refuses anything outside
# it, and this policy governs what it can do inside.
#
# The honest limit of this adapter: the filesystem server exposes no delete
# tool. Anything that brings a new path into existence therefore cannot be
# taken back by any call this server offers, so it is gated rather than
# pretended to be reversible.
version: 1

servers:
  fs:
    command: node
    args: ["node_modules/@modelcontextprotocol/server-filesystem/dist/index.js", "."]
    provenance: live

tools:
  # --- reads -------------------------------------------------------------
  - match: "fs.read_file"
    class: readonly
  - match: "fs.read_text_file"
    class: readonly
  - match: "fs.read_media_file"
    class: readonly
  - match: "fs.read_multiple_files"
    class: readonly
  - match: "fs.list_directory"
    class: readonly
  - match: "fs.list_directory_with_sizes"
    class: readonly
  - match: "fs.directory_tree"
    class: readonly
  - match: "fs.search_files"
    class: readonly
  - match: "fs.get_file_info"
    class: readonly
  - match: "fs.list_allowed_directories"
    class: readonly

  # --- writes ------------------------------------------------------------

  # Capture the file, then write it back. read_text_file returns
  # structuredContent shaped {content: "..."}, so the text lives at
  # $snapshot.content. This is exactly the sort of thing that is wrong until it
  # is run against the real server: the first version of this policy said
  # $snapshot and produced an object where a string was required.
  #
  # If the path does not exist yet, the pre-read finds nothing, there is no
  # prior state to restore, and the call is gated instead. That is not a
  # limitation being worked around; this server cannot delete, so creating a
  # file really is irreversible.
  - match: "fs.write_file"
    class: reversible
    snapshot:
      tool: "fs.read_text_file"
      args:
        path: "$.path"
      # What this server says when the file is not there. Anything else the
      # pre-read reports is a failure rather than absence -- a file that exists
      # and cannot be read is not a file you are creating -- and the write is
      # refused instead of being offered for approval.
      absent_when: ["ENOENT", "no such file"]
    inverse:
      tool: "fs.write_file"
      args:
        path: "$.path"
        content: "$snapshot.content"

  # An edit applies a diff, so the inverse restores the whole prior file rather
  # than trying to invert the diff. Inverting a diff is only correct if nothing
  # else touched the file, and drift detection is a better way to know that.
  - match: "fs.edit_file"
    class: reversible
    snapshot:
      tool: "fs.read_text_file"
      args:
        path: "$.path"
      # What this server says when the file is not there. Anything else the
      # pre-read reports is a failure rather than absence -- a file that exists
      # and cannot be read is not a file you are creating -- and the write is
      # refused instead of being offered for approval.
      absent_when: ["ENOENT", "no such file"]
    inverse:
      tool: "fs.write_file"
      args:
        path: "$.path"
        content: "$snapshot.content"

  # Reversible exactly when the destination did not exist, which is what
  # `expect: absent` says.
  #
  # Moving onto a path where nothing is, is undone by moving the file back:
  # the state this replaces is absence, and moving it off restores absence
  # exactly. Moving onto a file that does exist overwrites it, and one inverse
  # cannot both move the file back and restore what it landed on -- undo would
  # report success over a file it had destroyed.
  #
  # Both cases were gated before, because the machinery read "the pre-read
  # found nothing" as "there is nothing to put back" -- true of a write, and
  # precisely backwards here, where finding nothing is the safe case. Measured
  # both ways against the real server: as a plain reversible rule the safe move
  # came back `partial` with the file still moved, and the dangerous one came
  # back `rolled_back` with the overwritten file gone.
  #
  # And the pre-read is load-bearing, not belt and braces. This server's own
  # description of move_file says "If the destination exists, the operation
  # will fail" -- it does not. It renames over the top, silently, because
  # that is what rename(2) does on POSIX. Taking the description at its word
  # would have made this rule unconditionally reversible and the overwrite
  # unrecoverable and unremarked. tests/expect-absent.test.ts pins the real
  # behaviour so a version that starts matching its documentation is a
  # failing test rather than a surprise.
  - match: "fs.move_file"
    class: reversible
    snapshot:
      tool: "fs.read_text_file"
      args:
        path: "$.destination"
      # Same reasoning as the two writes above: anything that is not absence
      # is a failed read, not an empty destination, and a destination that
      # exists but cannot be read must not be treated as a free space.
      absent_when: ["ENOENT", "no such file"]
      expect: absent
    inverse:
      tool: "fs.move_file"
      args:
        source: "$.destination"
        destination: "$.source"

  # No rmdir exists on this server, so a directory once created stays.
  - match: "fs.create_directory"
    class: irreversible
    gate: always

# This policy is written for the server version named at the top. A later
# version can keep a tool's name and change what it takes, which would leave
# the policy above describing something else -- and undo would still produce an
# answer. `synartesis pin` prints a `pins:` block for the server you actually
# have; with it pasted in, a tool whose shape has moved stops the proxy at
# startup instead of being quietly trusted.
