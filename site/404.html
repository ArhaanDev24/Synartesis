<script>
/* Motion, added on top of a page that is already complete. The observer only
   ever adds a class; the hidden state it reveals exists solely under the
   no-preference guard, so with motion turned down this code runs and changes
   nothing anybody can see. */
(function(){
  const marked = [];
  for (const el of document.querySelectorAll('h1')) { el.classList.add('reveal-head'); marked.push(el); }
  for (const el of document.querySelectorAll('.error > *')) {
    if (!el.classList.contains('reveal-head')) { el.classList.add('reveal'); marked.push(el); }
  }
  marked.sort((a,b) => (a.compareDocumentPosition(b) & Node.DOCUMENT_POSITION_FOLLOWING) ? -1 : 1);

  // The stagger is read from the page rather than written into the markup:
  // each element waits on the marked ones before it under the same parent.
  const counted = new Map();
  for (const el of marked) {
    const at = counted.get(el.parentElement) || 0;
    counted.set(el.parentElement, at + 1);
    if (at) el.style.setProperty('--d', Math.min(at, 5) * 70 + 'ms');
  }

  const show = el => el.classList.add('is-in');
  if (!('IntersectionObserver' in window)) { marked.forEach(show); return; }
  const watcher = new IntersectionObserver((entries, self) => {
    for (const entry of entries) {
      if (entry.isIntersecting) { show(entry.target); self.unobserve(entry.target); }
    }
  // Threshold zero, deliberately. A heading that arrives from behind a mask
  // is clipped to nothing until it does, and Chrome measures the clip: it
  // reports the element as intersecting with an intersection rect of zero
  // area, so any threshold above nothing is a heading that waits forever.
  }, { rootMargin: '0px 0px -6% 0px', threshold: 0 });
  for (const el of marked) watcher.observe(el);
})();

// The header stays, so the section links in it keep working six thousand
// pixels down. The rule under it appears only once there is something above.
(function(){
  const header = document.querySelector('.site-header, .guide-header');
  if (!header) return;
  const bar = document.querySelector('.scroll-progress');
  let queued = false;
  function update() {
    queued = false;
    const y = window.scrollY;
    header.classList.toggle('is-scrolled', y > 6);
    if (bar) {
      const far = document.documentElement.scrollHeight - window.innerHeight;
      bar.style.transform = 'scaleX(' + (far > 0 ? Math.min(y / far, 1) : 0) + ')';
    }
  }
  addEventListener('scroll', () => {
    if (!queued) { queued = true; requestAnimationFrame(update); }
  }, { passive: true });
  update();
})();
