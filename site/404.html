    active.forEach(a => a.cancel()); active.clear(); reveals.clear();
    document.querySelectorAll('video').forEach(video => video.pause());
  }
  function reveal(section) {
    if (!allowed() || root.classList.contains('settled')) return;
    const targets = [...section.querySelectorAll('h2,.section-head .lede,.proof-copy>p,.steps li')];
    targets.forEach((element, i) => {
      const heading = element.tagName === 'H2';
      element.classList.add(heading ? 'reveal-head' : 'reveal');
      const frames = heading
